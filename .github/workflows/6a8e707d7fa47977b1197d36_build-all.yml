# =============================================================================
# GKI_KernelSU_SUSFS 整合构建工作流
# 将 main.yml + prepare.yml + build.yml + root-variants.yml 合并为单一文件
# 原始仓库: https://github.com/WildKernels/GKI_KernelSU_SUSFS
# =============================================================================
name: Build Kernels (Consolidated)
permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      kernel_build_version:
        description: "Kernel Version"
        type: choice
        options:
          - All
          - android12-5.10
          - android13-5.10
          - android13-5.15
          - android14-5.15
          - android14-6.1
          - android15-6.6
          - android16-6.12
        default: All
      feature_set:
        description: "Feature Set"
        type: choice
        options:
          - KSUN+SUSFS+NOMOUNT
          - KSUN+SUSFS+BBG+NET+DS
          - KSUN+SUSFS+BBG
          - KSUN+SUSFS+NET
          - KSUN+SUSFS+DS
          - KSUN+SUSFS
          - KSUN+BBG
          - KSUN+NET
          - KSUN+DS
          - KSUN
          - NOMOUNT
          - NONE
          - FULL
        default: FULL
      ksu_branch:
        description: "KernelSU branch or commit (empty = latest dev-susfs branch tip)"
        type: string
        required: false
        default: ""
      susfs_commit_android12-5-10:
        description: "SUSFS commit for android12-5.10 (empty = latest branch tip)"
        type: string
        required: false
        default: ""
      susfs_commit_android13-5-10:
        description: "SUSFS commit for android13-5.10 (empty = latest branch tip)"
        type: string
        required: false
        default: ""
      susfs_commit_android13-5-15:
        description: "SUSFS commit for android13-5.15 (empty = latest branch tip)"
        type: string
        required: false
        default: ""
      susfs_commit_android14-5-15:
        description: "SUSFS commit for android14-5.15 (empty = latest branch tip)"
        type: string
        required: false
        default: ""
      susfs_commit_android14-6-1:
        description: "SUSFS commit for android14-6.1 (empty = latest branch tip)"
        type: string
        required: false
        default: ""
      susfs_commit_android15-6-6:
        description: "SUSFS commit for android15-6.6 (empty = latest branch tip)"
        type: string
        required: false
        default: ""
      susfs_commit_android16-6-12:
        description: "SUSFS commit for android16-6.12 (empty = latest branch tip)"
        type: string
        required: false
        default: ""
      root_flavor:
        description: "Mutually exclusive root implementation (classic, next, or resukisu). Leave empty for KernelSU-Next legacy path."
        type: string
        required: false
        default: ""
      root_commit:
        description: "Exact root implementation commit (empty = auto-resolve)"
        type: string
        required: false
        default: ""
      sublevel_filter:
        description: "Sublevel filter: all = build every sublevel, lts = LTS branch only, latest = only the newest sublevel per version"
        type: choice
        options:
          - all
          - lts
          - latest
        default: all
      os_patch_level:
        description: "Advanced: specific patch date (YYYY-MM) or sublevel number. Overrides sublevel_filter when set."
        type: string
        required: false
        default: ""
      variant:
        description: "Artifact variant label (empty = Normal + config-defined variants)"
        type: string
        required: false
        default: ""
      preserve_abi:
        description: "Keep ABI/KMI protection files intact and verify their hashes"
        type: boolean
        required: false
        default: false
      build_bypass:
        description: "Produce the legacy bypass image"
        type: boolean
        required: false
        default: true
      test_release_notes:
        description: "Only render release notes preview, skip all builds"
        type: boolean
        required: false
        default: false

jobs:
  # ===========================================================================
  # Job 1: 解析 NoMount 最新 commit
  # ===========================================================================
  resolve-nomount:
    name: Resolve NoMount commit
    runs-on: ubuntu-latest
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
    steps:
      - name: Resolve latest NoMount dev commit
        id: resolve
        if: ${{ !inputs.test_release_notes && (contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL') }}
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git ls-remote https://github.com/maxsteeel/nomount.git refs/heads/dev | awk '{print $1}')"
          if [ -z "$sha" ] || ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Failed to resolve NoMount dev branch tip." >&2
            exit 1
          fi
          echo "nomount_commit=$sha" >> "$GITHUB_OUTPUT"
          echo "Resolved NoMount dev commit: $sha"

  # ===========================================================================
  # Job 2: 构建 NoMount 元模块
  # ===========================================================================
  build-nomount-module:
    name: Build NoMount metamodule
    needs: resolve-nomount
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        if: ${{ !inputs.test_release_notes && (contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL') }}
      - name: Build NoMount metamodule
        id: nomount-metamodule
        if: ${{ !inputs.test_release_notes && (contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL') }}
        uses: ./.github/actions/nomount-metamodule
        with:
          commit: ${{ needs.resolve-nomount.outputs.nomount_commit }}
      - name: Upload NoMount metamodule
        if: ${{ !inputs.test_release_notes && (contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL') }}
        uses: actions/upload-artifact@v7
        with:
          name: NoMount-Metamodule
          path: ${{ steps.nomount-metamodule.outputs.module_path }}
          if-no-files-found: error
          compression-level: 0

  # ===========================================================================
  # Job 3: 生成合并构建矩阵
  # 合并原 prepare.yml 的逻辑：遍历所有选中版本的 JSON 配置，构建单一矩阵
  # ===========================================================================
  generate-matrix:
    name: Generate build matrix
    needs: resolve-nomount
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.final.outputs.matrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Generate Combined Build Matrix
        id: final
        if: ${{ !inputs.test_release_notes }}
        shell: bash
        env:
          KERNEL_BUILD_VERSION: ${{ inputs.kernel_build_version }}
          SUSFS_12_510: ${{ inputs.susfs_commit_android12-5-10 }}
          SUSFS_13_510: ${{ inputs.susfs_commit_android13-5-10 }}
          SUSFS_13_515: ${{ inputs.susfs_commit_android13-5-15 }}
          SUSFS_14_515: ${{ inputs.susfs_commit_android14-5-15 }}
          SUSFS_14_61: ${{ inputs.susfs_commit_android14-6-1 }}
          SUSFS_15_66: ${{ inputs.susfs_commit_android15-6-6 }}
          SUSFS_16_612: ${{ inputs.susfs_commit_android16-6-12 }}
          PATCH_FILTER: ${{ inputs.os_patch_level }}
          SUBLEVEL_FILTER: ${{ inputs.sublevel_filter }}
          VARIANT_REQ: ${{ inputs.variant }}
        run: |
          set -euo pipefail

          VERSIONS=("android12-5.10" "android13-5.10" "android13-5.15" "android14-5.15" "android14-6.1" "android15-6.6" "android16-6.12")
          SELECTED="${KERNEL_BUILD_VERSION}"
          PF="${PATCH_FILTER}"
          SL="${SUBLEVEL_FILTER}"
          VR="${VARIANT_REQ}"

          ALL_ENTRIES="[]"

          for VERSION in "${VERSIONS[@]}"; do
            if [ "$SELECTED" != "All" ] && [ "$SELECTED" != "$VERSION" ]; then
              continue
            fi

            CONFIG_FILE=".github/config/${VERSION}.json"
            if [ ! -f "$CONFIG_FILE" ]; then
              echo "Warning: Config file not found: $CONFIG_FILE"
              continue
            fi

            # Map version to susfs commit
            case "$VERSION" in
              android12-5.10) SUSFS_COMMIT="${SUSFS_12_510}" ;;
              android13-5.10) SUSFS_COMMIT="${SUSFS_13_510}" ;;
              android13-5.15) SUSFS_COMMIT="${SUSFS_13_515}" ;;
              android14-5.15) SUSFS_COMMIT="${SUSFS_14_515}" ;;
              android14-6.1)  SUSFS_COMMIT="${SUSFS_14_61}" ;;
              android15-6.6)  SUSFS_COMMIT="${SUSFS_15_66}" ;;
              android16-6.12) SUSFS_COMMIT="${SUSFS_16_612}" ;;
              *) SUSFS_COMMIT="" ;;
            esac

            ANDROID_PART=$(echo "$VERSION" | cut -d- -f1)
            KERNEL_PART=$(echo "$VERSION" | cut -d- -f2)
            CONFIG_JSON=$(cat "$CONFIG_FILE" | jq -c .)

            # Build entries: Normal variant + config-defined variants (when no explicit variant requested)
            ENTRIES=$(jq -c \
              --arg version "$VERSION" \
              --arg android "$ANDROID_PART" \
              --arg kernel "$KERNEL_PART" \
              --arg susfs "$SUSFS_COMMIT" \
              --arg variant_req "$VR" \
              '($version | split("-")) as $vp
              | (.include) as $targets
              | [
                  $targets[] | {
                    version: $version,
                    android_version: $vp[0],
                    kernel_version: $vp[1],
                    sublevel: .sublevel,
                    os_patch_level: .date,
                    variant: (if $variant_req == "" then "Normal" else $variant_req end),
                    susfs_commit: $susfs
                  }
                ] + (if $variant_req == "" then [
                  $targets[] | select(.variant != null) | {
                    version: $version,
                    android_version: $vp[0],
                    kernel_version: $vp[1],
                    sublevel: .sublevel,
                    os_patch_level: .date,
                    variant: .variant,
                    susfs_commit: $susfs
                  }
                ] else [] end)
              ' <<< "$CONFIG_JSON")

            ALL_ENTRIES=$(jq -c --argjson all "$ALL_ENTRIES" --argjson new "$ENTRIES" \
              '$all + $new | unique_by([.android_version, .kernel_version, .sublevel, .os_patch_level, .variant])' \
              <<< '{}')
          done

          # ── Apply sublevel / patch-level filter ──
          # Priority: os_patch_level (advanced) > sublevel_filter (dropdown) > all
          if [ -n "$PF" ] && [ "$PF" != "all" ]; then
            # Advanced: exact patch date (YYYY-MM) or sublevel number
            FILTERED=$(jq -c --arg patch "$PF" '[.[] | select(.os_patch_level == $patch)]' <<< "$ALL_ENTRIES")
            if [ "$(jq 'length' <<< "$FILTERED")" -eq 0 ]; then
              FILTERED=$(jq -c --arg sub "$PF" '[.[] | select(.sublevel == $sub)]' <<< "$ALL_ENTRIES")
            fi
            ALL_ENTRIES="$FILTERED"
          elif [ "$SL" = "lts" ]; then
            # LTS branch only
            ALL_ENTRIES=$(jq -c '[.[] | select(.os_patch_level == "lts")]' <<< "$ALL_ENTRIES")
          elif [ "$SL" = "latest" ]; then
            # Only the newest sublevel per version (highest numeric sublevel, excluding LTS "X")
            ALL_ENTRIES=$(jq -c '
              group_by(.version)
              | map(
                  ([.[] | (.sublevel | tonumber? // -1)] | max) as $max_sub
                  | [.[] | select((.sublevel | tonumber? // -1) == $max_sub)]
                )
              | flatten
            ' <<< "$ALL_ENTRIES")
          fi

          if [ "$(jq 'length' <<< "$ALL_ENTRIES")" -eq 0 ]; then
            echo "Error: no build targets match the given filters." >&2
            exit 1
          fi

          FINAL="{\"include\": $ALL_ENTRIES}"
          echo "matrix=$FINAL" >> "$GITHUB_OUTPUT"
          echo "Matrix has $(jq '.include | length' <<< "$FINAL") entries"

  # ===========================================================================
  # Job 4: 内核构建（矩阵）
  # 合并原 build.yml 的全部步骤，inputs.* → matrix.* / inputs.* 映射
  # ===========================================================================
  build:
    name: "${{ matrix.kernel_version }}.${{ matrix.sublevel }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }} (${{ matrix.variant }})"
    needs: [generate-matrix, resolve-nomount]
    if: ${{ !inputs.test_release_notes }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      actions: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"
        testing: false

    - name: Setup more Swap (for LTO)
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 16

    - name: Setup Build Environment
      uses: ./.github/actions/setup-build-environment
      with:
        version: ${{ matrix.version }}
        sublevel: ${{ matrix.sublevel }}
      env:
        BOOT_SIGN_KEY: ${{ secrets.BOOT_SIGN_KEY }}

    - name: Download Kernel Repository
      uses: ./.github/actions/download-kernel
      with:
        version: ${{ matrix.version }}
        android_version: ${{ matrix.android_version }}
        kernel_version: ${{ matrix.kernel_version }}
        os_patch_level: ${{ matrix.os_patch_level }}

    - name: Build FUSE-BPF Userspace Daemon (Issue #211)
      if: ${{ contains(matrix.version, 'lts') && matrix.version == 'android16-6.12' }}
      uses: ./.github/actions/fuse-bpf
      with:
        version: ${{ matrix.version }}
        kernel_version: ${{ matrix.kernel_version }}
        android_version: ${{ matrix.android_version }}

    - name: Set Build Timestamp from Kernel Commit
      shell: bash
      run: |
        set -x
        OS_PATCH_LEVEL_INPUT="${{ matrix.os_patch_level }}"
        if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
          if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
            OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
          else
            OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
          fi
        else
          OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
        fi
        FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
        SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
        echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
        KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
        echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
        GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
        echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
        echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

    - name: Extract Sublevel and Set File Name
      id: extract
      uses: ./.github/actions/extract-sublevel-file-name
      with:
        android_version: ${{ matrix.android_version }}
        kernel_version: ${{ matrix.kernel_version }}
        sublevel: ${{ matrix.sublevel }}
        os_patch_level: ${{ matrix.os_patch_level }}
        variant: ${{ matrix.variant }}

    - name: Kernel Fixes
      uses: ./.github/actions/kernel-fixes
      with:
        version: ${{ matrix.version }}
        android_version: ${{ matrix.android_version }}
        kernel_version: ${{ matrix.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}
        os_patch_level: ${{ matrix.os_patch_level }}

    - name: Capture source ABI/KMI safeguards
      if: ${{ inputs.preserve_abi }}
      uses: ./.github/actions/abi-kmi-safeguards
      with:
        mode: capture

    - name: Setup Selected Root Implementation
      if: ${{ inputs.root_flavor != '' }}
      uses: ./.github/actions/root-setup
      with:
        flavor: ${{ inputs.root_flavor }}
        commit: ${{ inputs.root_commit }}

    - name: Setup KernelSU-Next
      if: ${{ inputs.root_flavor == '' && (contains(inputs.feature_set, 'KSUN') || inputs.feature_set == 'FULL') }}
      uses: ./.github/actions/kernelsu
      with:
        ksu_branch: ${{ inputs.ksu_branch }}

    - name: Verify root ABI/KMI safeguards
      if: ${{ inputs.preserve_abi }}
      uses: ./.github/actions/abi-kmi-safeguards
      with:
        mode: verify

    - name: SUSFS
      if: ${{ contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'FULL' }}
      uses: ./.github/actions/susfs
      with:
        susfs_commit: ${{ matrix.susfs_commit }}
        version: ${{ matrix.version }}
        android_version: ${{ matrix.android_version }}
        kernel_version: ${{ matrix.kernel_version }}
        os_patch_level: ${{ matrix.os_patch_level }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Baseband Guard
      if: ${{ contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'FULL' }}
      uses: ./.github/actions/bbg

    - name: Setup Networking
      if: ${{ contains(inputs.feature_set, 'NET') || inputs.feature_set == 'FULL' }}
      uses: ./.github/actions/networking
      with:
        version: ${{ matrix.version }}
        kernel_version: ${{ matrix.kernel_version }}
        android_version: ${{ matrix.android_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: DroidSpaces-OSS Patches
      if: ${{ contains(inputs.feature_set, 'DS') || inputs.feature_set == 'FULL' }}
      uses: ./.github/actions/droidspaces
      with:
        version: ${{ matrix.version }}
        kernel_version: ${{ matrix.kernel_version }}

    - name: Apply NTSync Patches
      uses: ./.github/actions/ntsync
      with:
        version: ${{ matrix.version }}
        kernel_version: ${{ matrix.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply Ptrace Patch
      uses: ./.github/actions/ptrace
      with:
        kernel_version: ${{ matrix.kernel_version }}

    - name: Apply Unicode Fix Patch
      uses: ./.github/actions/unicode-fix
      with:
        kernel_version: ${{ matrix.kernel_version }}

    - name: Setup Misc Configs
      uses: ./.github/actions/misc

    - name: Enable BTF
      uses: ./.github/actions/btf
      with:
        version: ${{ matrix.version }}
        kernel_version: ${{ matrix.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Apply Device-Specific Patches
      uses: ./.github/actions/apply-device-patches
      with:
        version: ${{ matrix.version }}
        kernel_version: ${{ matrix.kernel_version }}

    - name: Capture approved feature ABI/KMI baseline
      if: ${{ inputs.preserve_abi }}
      uses: ./.github/actions/abi-kmi-safeguards
      with:
        mode: capture

    - name: Integrate NoMount
      if: ${{ needs.resolve-nomount.outputs.nomount_commit != '' || contains(inputs.feature_set, 'NOMOUNT') || inputs.feature_set == 'FULL' }}
      uses: ./.github/actions/nomount
      with:
        commit: ${{ needs.resolve-nomount.outputs.nomount_commit }}
        kernel_version: ${{ matrix.kernel_version }}

    - name: Apply Kernel Branding
      uses: ./.github/actions/apply-kernel-branding
      with:
        variant: ${{ matrix.variant }}
        kernel_version: ${{ matrix.kernel_version }}
        android_version: ${{ matrix.android_version }}
        version: ${{ matrix.version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Remove Protected Exports
      if: ${{ !inputs.preserve_abi }}
      uses: ./.github/actions/remove-protected-exports

    - name: Verify NoMount ABI/KMI safeguards
      if: ${{ inputs.preserve_abi }}
      uses: ./.github/actions/abi-kmi-safeguards
      with:
        mode: verify

    - name: Clean Kernel Flags
      uses: ./.github/actions/clean-kernel-flags

    - name: Scan and collect patch rejects
      id: scan
      if: ${{ always() }}
      uses: ./.github/actions/scan-patch-rejects

    - name: Upload Rejects
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-Rejects
        path: patch-rejects/
        if-no-files-found: ignore
        compression-level: 9

    - name: Setup Cache and Build Environment
      uses: ./.github/actions/cache-setup
      with:
        version: ${{ matrix.version }}
        android_version: ${{ matrix.android_version }}
        kernel_version: ${{ matrix.kernel_version }}
        sublevel: ${{ steps.extract.outputs.sublevel }}

    - name: Get Cache Stats
      uses: ./.github/actions/cache-stats
      with:
        clear_stats: true

    - name: Initialize Config Fragment
      run: touch "${{ github.workspace }}/wild_gki.fragment"

    - name: Build Normal Kernel
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
      uses: ./.github/actions/build-kernel
      with:
        version: ${{ matrix.version }}
        bypass: false

    - name: Get Cache Stats
      uses: ./.github/actions/cache-stats
      with:
        clear_stats: false

    - name: Build Bypass Kernel
      if: ${{ inputs.build_bypass }}
      env:
        SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
        KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
      uses: ./.github/actions/build-kernel
      with:
        bypass: true
        version: ${{ matrix.version }}

    - name: Consolidated Build Summary
      if: ${{ always() }}
      shell: bash
      run: |
        SUMMARY_BASE="${{ steps.extract.outputs.file_name }}"
        if [ -z "${SUMMARY_BASE}" ]; then
          SUMMARY_BASE="${{ matrix.kernel_version }}.${{ matrix.sublevel }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }}"
          VARIANT="${{ matrix.variant }}"
          if [ -n "${VARIANT}" ] && [ "${VARIANT}" != "Normal" ]; then
            SUMMARY_BASE="${SUMMARY_BASE}-${VARIANT}"
          fi
        fi
        SUMMARY_FILE="/tmp/build-summary-${SUMMARY_BASE}.md"
        echo "SUMMARY_BASE=${SUMMARY_BASE}" >> "$GITHUB_ENV"

        if [ "${{ job.status }}" = "success" ]; then
          STATUS="✅ Success"
        else
          STATUS="❌ Failed"
        fi

        KERNEL_VER_STR=""
        if [ -f "/home/runner/out/dist/Image" ]; then
          KERNEL_VER_STR=$(strings "/home/runner/out/dist/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
        elif [ -f "/home/runner/out/Image" ]; then
          KERNEL_VER_STR=$(strings "/home/runner/out/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
        fi

        KSU_VER="${KSU_VERSION:-N/A}"
        KSU_TAG="${KSU_GIT_TAG:-N/A}"
        ROOT_IMPL="${ROOT_IMPLEMENTATION:-KernelSU-Next (legacy path)}"
        ROOT_SHA="${ROOT_COMMIT:-${KSU_COMMIT:-N/A}}"
        NOMOUNT_SHA="${NOMOUNT_COMMIT:-N/A}"
        SUSFS_SHA="${SUSFS_COMMIT:-N/A}"

        SUSFS_VER="N/A"
        if [ -f "${{ github.workspace }}/kernel/common/include/linux/susfs.h" ]; then
          SUSFS_VER=$(grep '#define SUSFS_VERSION' "${{ github.workspace }}/kernel/common/include/linux/susfs.h" | awk -F'"' '{print $2}' || echo "N/A")
        fi

        {
          echo "## ${{ matrix.android_version }} ${{ matrix.kernel_version }}.${{ matrix.sublevel }} (${{ matrix.variant }}) — ${STATUS}"
          echo
          echo "| Metric | Value |"
          echo "|--------|-------|"
          echo "| **Status** | ${STATUS} |"
          echo "| **Kernel** | ${{ matrix.kernel_version }}.${{ matrix.sublevel }}-${{ matrix.android_version }}-${{ matrix.os_patch_level }} |"
          if [ -n "$KERNEL_VER_STR" ]; then
            echo "| **Version String** | \`${KERNEL_VER_STR}\` |"
          fi
          echo "| **KSU Version** | ${KSU_VER} |"
          echo "| **KSU Tag** | ${KSU_TAG} |"
          echo "| **Root Implementation** | ${ROOT_IMPL} |"
          echo "| **Root Commit** | ${ROOT_SHA} |"
          echo "| **SUSFS Version** | ${SUSFS_VER} |"
          echo "| **SUSFS Commit** | ${SUSFS_SHA} |"
          echo "| **NoMount Commit** | ${NOMOUNT_SHA} |"
          echo "| **Feature Set** | ${{ inputs.feature_set }} |"
          echo "| **Variant** | ${{ matrix.variant }} |"
          echo
          if [ -f /tmp/kernel-fixes-summary.md ]; then
            echo "### 🔧 Kernel Fixes"
            cat /tmp/kernel-fixes-summary.md
            echo
          fi
        } > "$SUMMARY_FILE"

    - name: Upload Build Summary Artifact
      if: ${{ always() }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.SUMMARY_BASE }}-Summary
        path: /tmp/build-summary-${{ env.SUMMARY_BASE }}.md
        if-no-files-found: ignore
        compression-level: 9

    - name: Upload Artifacts
      id: kernel-artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
        path: ${{ github.workspace }}/AnyKernel3/**
        if-no-files-found: ignore
        compression-level: 9

    - name: Write Build-verified only artifact metadata
      if: ${{ success() && inputs.root_flavor != '' && needs.resolve-nomount.outputs.nomount_commit != '' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        metadata_file="${{ github.workspace }}/${{ steps.extract.outputs.file_name }}-metadata.json"
        artifacts_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"
        artifacts_json="$(curl --fail --silent --show-error \
          --header "Authorization: Bearer ${GH_TOKEN}" \
          --header "X-GitHub-Api-Version: 2022-11-28" \
          "$artifacts_api")"

        resolve_artifact() {
          local artifact_name="$1"
          local matches
          matches="$(jq --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name and .expired == false)]' \
            <<<"$artifacts_json")"
          if [ "$(jq 'length' <<<"$matches")" -ne 1 ]; then
            echo "Expected exactly one available artifact named ${artifact_name}." >&2
            exit 1
          fi
          jq -r '.[0] | [.archive_download_url, .digest] | @tsv' <<<"$matches"
        }

        read -r kernel_artifact_url kernel_artifact_sha256 < <(
          resolve_artifact "${{ steps.extract.outputs.file_name }}-AnyKernel3"
        )
        read -r nomount_module_url nomount_module_sha256 < <(
          resolve_artifact "NoMount-Metamodule"
        )

        jq -n \
          --arg method "GKI source build with SHA-pinned root implementation, SUSFS, and NoMount" \
          --arg root_implementation "${ROOT_IMPLEMENTATION:-KernelSU-Next (legacy path)}" \
          --arg root_manager "${ROOT_MANAGER:-KernelSU-Next Manager}" \
          --arg root_version "${ROOT_VERSION:-${KSU_GIT_TAG:-N/A}}" \
          --arg root_commit "${ROOT_COMMIT:-${KSU_COMMIT:-N/A}}" \
          --arg susfs_commit "${SUSFS_COMMIT:-N/A}" \
          --arg nomount_commit "${{ needs.resolve-nomount.outputs.nomount_commit }}" \
          --arg android_branch "${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.os_patch_level }}" \
          --arg kmi "${{ matrix.android_version }}-${{ matrix.kernel_version }}" \
          --arg kernel_source_commit "${KERNEL_SOURCE_COMMIT:-N/A}" \
          --arg provenance_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
          --arg artifact_url "$kernel_artifact_url" \
          --arg sha256 "$kernel_artifact_sha256" \
          --arg nomount_module_url "$nomount_module_url" \
          --arg nomount_module_sha256 "$nomount_module_sha256" \
          --arg status "Build-verified only" \
          --arg catalog_availability "eligible-with-provenance-and-checksums" \
          --arg device_compatibility "not-validated" \
          --arg flashability "not-guaranteed" \
          --arg boot "not-guaranteed" \
          '{
            method: $method,
            root: {
              implementation: $root_implementation,
              manager: $root_manager,
              version: $root_version,
              commit: $root_commit
            },
            susfs_revision: $susfs_commit,
            nomount_commit: $nomount_commit,
            android_branch: $android_branch,
            kmi: $kmi,
            kernel_source_commit: $kernel_source_commit,
            provenance_url: $provenance_url,
            artifact_url: $artifact_url,
            sha256: $sha256,
            nomount_metamodule: {
              commit: $nomount_commit,
              artifact_url: $nomount_module_url,
              sha256: $nomount_module_sha256
            },
            catalog: {
              availability: $catalog_availability,
              device_compatibility: $device_compatibility,
              flashability: $flashability,
              boot: $boot
            },
            status: $status
          }' > "$metadata_file"

        jq -e '
          .status == "Build-verified only" and
          (.root.manager | length > 0) and
          (.root.version | length > 0) and
          (.susfs_revision | test("^[0-9a-f]{40}$")) and
          (.nomount_commit | test("^[0-9a-f]{40}$")) and
          (.kernel_source_commit | test("^[0-9a-f]{40}$")) and
          (.artifact_url | startswith("https://")) and
          (.sha256 | test("^sha256:[0-9a-f]{64}$")) and
          (.nomount_metamodule.commit == .nomount_commit) and
          (.nomount_metamodule.artifact_url | startswith("https://")) and
          (.nomount_metamodule.sha256 | test("^sha256:[0-9a-f]{64}$")) and
          .catalog.availability == "eligible-with-provenance-and-checksums" and
          .catalog.device_compatibility == "not-validated" and
          .catalog.flashability == "not-guaranteed" and
          .catalog.boot == "not-guaranteed"
        ' "$metadata_file" > /dev/null

    - name: Upload Build-verified only artifact metadata
      if: ${{ success() && inputs.root_flavor != '' && needs.resolve-nomount.outputs.nomount_commit != '' }}
      uses: actions/upload-artifact@v7
      with:
        name: ${{ steps.extract.outputs.file_name }}-Metadata
        path: ${{ github.workspace }}/${{ steps.extract.outputs.file_name }}-metadata.json
        if-no-files-found: error
        compression-level: 9

  # ===========================================================================
  # Job 5: 收集 patch reject 文件
  # ===========================================================================
  rej:
    name: Collect patch rejects
    if: ${{ !inputs.test_release_notes && always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    needs: build
    steps:
    - name: Download Misc Artifacts
      uses: actions/download-artifact@v7
      with:
        path: ./downloaded-artifacts
        pattern: '*-Rejects'
        merge-multiple: false

    - name: Process Reject Artifacts
      run: |
        mkdir -p aio-rejects
        for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            source_dir="$dir"
            if [ -d "$dir/patch-rejects" ]; then
              source_dir="$dir/patch-rejects"
            fi
            mapfile -t rej_files < <(find "$source_dir" -type f -name '*.rej' | sort)
            filtered_rej_files=()
            for rej_file in "${rej_files[@]}"; do
              rel_rej="${rej_file#${source_dir}/}"
              rel_name="$(basename "$rel_rej")"
              if [ "$rel_rej" = "common/mm/rmap.c.rej" ] || [ "$rel_name" = "i2c-nomadik.c.rej" ]; then
                echo "Skipping $rel_rej because it is an ignored reject file"
                continue
              fi
              filtered_rej_files+=("$rej_file")
            done
            if [ "${#filtered_rej_files[@]}" -eq 0 ]; then
              echo "Skipping $dirname because it only contains ignored reject files"
              continue
            fi
            mkdir -p "aio-rejects/$original_name"
            if [ -d "$dir/patch-rejects" ]; then
              cp -r "$dir/patch-rejects/." "aio-rejects/$original_name/"
            else
              cp -r "$dir/." "aio-rejects/$original_name/"
            fi
            find "aio-rejects/$original_name" -type f -name 'i2c-nomadik.c.rej' -delete
        done
        if [ "$(ls -A aio-rejects)" ]; then
            cd aio-rejects
            zip -r -q -9 ../AIO-REJ.zip .
            cd ..
        else
            echo "No rejects found to upload."
        fi

    - name: Rejects Summary
      run: |
        echo "Reject artifacts were collected locally only and are not uploaded." >> "$GITHUB_STEP_SUMMARY"

    - name: Upload AIO-REJ Artifact
      uses: actions/upload-artifact@v7
      with:
        name: AIO-REJ
        path: AIO-REJ.zip
        if-no-files-found: ignore

  # ===========================================================================
  # Job 6: 汇总构建摘要
  # ===========================================================================
  summary:
    name: Build summary
    if: ${{ !inputs.test_release_notes && always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    needs: build
    steps:
    - name: Download All Build Summaries
      uses: actions/download-artifact@v7
      with:
        path: ./summaries
        pattern: '*-Summary'
        merge-multiple: true

    - name: Workflow Build Summary
      run: |
        {
          echo "# 📋 Build Summary — $(date -u '+%Y-%m-%d %H:%M UTC')"
          echo
          echo "**Feature Set:** ${{ inputs.feature_set }}"
          echo "**KSU Branch:** ${{ inputs.ksu_branch || 'latest dev' }}"
          echo "**Sublevel Filter:** ${{ inputs.sublevel_filter }}"
          if [ -n "${{ inputs.os_patch_level }}" ]; then
            echo "**Patch Level Override:** ${{ inputs.os_patch_level }}"
          fi
          echo
          SUCCESS_COUNT=0
          FAIL_COUNT=0
          for f in ./summaries/*.md; do
            [ -f "$f" ] || continue
            if grep -q "✅ Success" "$f"; then
              SUCCESS_COUNT=$((SUCCESS_COUNT + 1))
            else
              FAIL_COUNT=$((FAIL_COUNT + 1))
            fi
          done
          TOTAL=$((SUCCESS_COUNT + FAIL_COUNT))
          echo "**Results:** ${SUCCESS_COUNT}/${TOTAL} succeeded"
          if [ "$FAIL_COUNT" -gt 0 ]; then
            echo "  - ❌ ${FAIL_COUNT} failed"
          fi
          echo
          echo "---"
          echo
          for f in ./summaries/*.md; do
            [ -f "$f" ] || continue
            cat "$f"
            echo
            echo "---"
            echo
          done
          echo
          echo "> **SUSFS Commits:**"
          echo "> - android12-5.10: ${{ inputs.susfs_commit_android12-5-10 || 'latest' }}"
          echo "> - android13-5.10: ${{ inputs.susfs_commit_android13-5-10 || 'latest' }}"
          echo "> - android13-5.15: ${{ inputs.susfs_commit_android13-5-15 || 'latest' }}"
          echo "> - android14-5.15: ${{ inputs.susfs_commit_android14-5-15 || 'latest' }}"
          echo "> - android14-6.1: ${{ inputs.susfs_commit_android14-6-1 || 'latest' }}"
          echo "> - android15-6.6: ${{ inputs.susfs_commit_android15-6-6 || 'latest' }}"
          echo "> - android16-6.12: ${{ inputs.susfs_commit_android16-6-12 || 'latest' }}"
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Cleanup Summary Files
      if: ${{ always() }}
      run: rm -rf ./summaries

    - name: Delete Summary Artifacts
      if: ${{ always() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        RUN_ID="${{ github.run_id }}"
        ARTIFACTS=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" --jq '.artifacts[] | select(.name | endswith("-Summary")) | .id')
        for id in $ARTIFACTS; do
          echo "Deleting summary artifact id=$id"
          gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/${id}" || true
        done

  # ===========================================================================
  # Job 7: 发布 Release
  # ===========================================================================
  release:
    name: Publish release
    runs-on: ubuntu-latest
    if: ${{ !inputs.test_release_notes && (inputs.release_type == 'Pre-Release' || inputs.release_type == 'Release') && always() }}
    permissions:
      contents: write
    needs:
    - build
    - build-nomount-module
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_NOTES: .github/config/RELEASE_NOTES.md
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
    - name: Validate Build Results
      run: |
        set -euo pipefail
        if [ "${{ needs.build.result }}" != "success" ]; then
          echo "Build job did not succeed (result: ${{ needs.build.result }})"
          exit 1
        fi
        echo "All selected builds succeeded."

    - name: Free Disk Space
      uses: endersonmenezes/free-disk-space@v3
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_packages_one_command: true
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
        rm_cmd: "rmz"
        rmz_version: "3.1.1"
        testing: false

    - name: Checkout code
      uses: actions/checkout@v7

    - name: Generate New Tag
      id: tag
      run: |
        mapfile -t RELEASE_TAGS < <(gh api --paginate "repos/${{ github.repository }}/tags?per_page=100" --jq '.[].name' 2>/dev/null | grep -E '^r[0-9]+$' || true)
        LATEST_REV=0
        for TAG in "${RELEASE_TAGS[@]}"; do
          REV="${TAG#r}"
          if [[ "$REV" =~ ^[0-9]+$ && "$REV" -gt "$LATEST_REV" ]]; then
            LATEST_REV="$REV"
          fi
        done
        if [[ "$LATEST_REV" -gt 0 ]]; then
          NEW_TAG="r$((LATEST_REV + 1))"
        else
          NEW_TAG="r1"
        fi
        if [[ ${#RELEASE_TAGS[@]} -gt 0 ]]; then
          echo "Latest r-tag: r${LATEST_REV}"
        else
          echo "No existing r-tags found; starting at r1"
        fi
        echo "New tag: $NEW_TAG"
        echo "NEW_TAG=${NEW_TAG}" >> $GITHUB_ENV
        echo "new_tag=$NEW_TAG" >> "$GITHUB_OUTPUT"

    - name: Set Release Title
      id: release_meta
      run: |
        set -euo pipefail
        if [[ "${NEW_TAG}" =~ ^r([0-9]+)$ ]]; then
          REV_NUM="${BASH_REMATCH[1]}"
          release_title="Release ${REV_NUM}"
        else
          release_title="Release ${NEW_TAG}"
        fi
        echo "release_title=$release_title" >> "$GITHUB_OUTPUT"

    - name: Extract KernelSU Version Info
      id: ksu_version
      run: |
        set -euo pipefail
        KSU_REPO="https://github.com/pershoot/KernelSU-Next.git"
        KSU_INPUT="${{ inputs.ksu_branch }}"
        if [ -z "$KSU_INPUT" ]; then
          KSU_INPUT="dev-susfs"
        fi
        if git ls-remote --heads "$KSU_REPO" "$KSU_INPUT" | grep -q .; then
          echo "Cloning KernelSU-Next from branch: $KSU_INPUT"
          git clone --branch "$KSU_INPUT" "$KSU_REPO" /tmp/kernelsu-next
          cd /tmp/kernelsu-next
          KSUN_COMMIT=$(git rev-parse HEAD)
        else
          echo "Cloning KernelSU-Next from dev-susfs branch, then checking out commit: $KSU_INPUT"
          git clone --branch dev-susfs "$KSU_REPO" /tmp/kernelsu-next
          cd /tmp/kernelsu-next
          git fetch --depth=50 origin "$KSU_INPUT"
          git checkout "$KSU_INPUT"
          KSUN_COMMIT="$KSU_INPUT"
        fi
        retry() {
          local n=0
          until [ "$n" -ge 5 ]; do
            "$@" && return 0
            n=$((n+1))
            echo "retry $n/5 failed for: $*" >&2
            sleep 5
          done
          return 1
        }
        OFFICIAL_KSU_REPO="https://github.com/KernelSU-Next/KernelSU-Next.git"
        retry git fetch "$OFFICIAL_KSU_REPO" dev
        STOCK_COMMIT=$(git merge-base HEAD FETCH_HEAD)
        echo "KSU Stock Commit (official sync point): $STOCK_COMMIT"
        COMMITS_COUNT=$(git rev-list --count "$STOCK_COMMIT")
        BASE_VERSION=30000
        KSU_VERSION=$(expr $COMMITS_COUNT "+" $BASE_VERSION)
        KSU_GIT_TAG=$(git describe --tags --abbrev=0 "$STOCK_COMMIT" 2>/dev/null || echo "no-tag")
        MANAGER_RUN_ID=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors "https://api.github.com/repos/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml/runs?head_sha=${STOCK_COMMIT}" | jq -r '.workflow_runs[0].id // empty')
        if [[ -n "${MANAGER_RUN_ID:-}" ]]; then
          KSU_MANAGER="https://github.com/KernelSU-Next/KernelSU-Next/actions/runs/${MANAGER_RUN_ID}"
        else
          KSU_MANAGER="https://github.com/KernelSU-Next/KernelSU-Next/actions/workflows/build-manager-ci.yml"
        fi
        echo "Commits count: $COMMITS_COUNT"
        echo "KSU Version: $KSU_VERSION"
        echo "KSU Git Tag: $KSU_GIT_TAG"
        echo "KSU Manager: $KSU_MANAGER"
        echo "KSUN_BRANCH=$KSU_INPUT" >> $GITHUB_ENV
        echo "KSUN_COMMIT=$KSUN_COMMIT" >> $GITHUB_ENV
        echo "KSU_COMMITS_COUNT=$COMMITS_COUNT" >> $GITHUB_ENV
        echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV
        echo "KSU_GIT_TAG=$KSU_GIT_TAG" >> $GITHUB_ENV
        echo "KSU_MANAGER=$KSU_MANAGER" >> $GITHUB_ENV

    - name: Set release body
      run: |
        set -e
        RELEASE_NOTES_PATH="$RELEASE_NOTES"
        : > release_body.md
        python3 .github/scripts/render_release_body.py "$RELEASE_NOTES_PATH" > release_body.md

    - name: Publish release notes preview
      run: |
        {
          echo "## Release Notes Preview"
          echo
          cat release_body.md
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Download AnyKernel3 Artifacts
      uses: actions/download-artifact@v7
      with:
        path: release-assets
        pattern: '*-AnyKernel3'
        merge-multiple: false

    - name: Download NoMount metamodule
      uses: actions/download-artifact@v7
      with:
        path: release-assets
        pattern: '*NoMount-Metamodule'
        merge-multiple: false
        if-no-files-found: ignore

    - name: Zip AnyKernel3 for Release
      run: |
        set -e
        shopt -s nullglob
        for dir in release-assets/*-AnyKernel3; do
          zip_name="${dir}.zip"
          rm -f "$zip_name"
          cd "$dir"
          zip -r -q -9 "../$(basename "$zip_name")" .
          cd - >/dev/null
        done

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.new_tag }}
        name: ${{ steps.release_meta.outputs.release_title }}
        body_path: release_body.md
        draft: false
        prerelease: ${{ inputs.release_type == 'Pre-Release' }}
        files: |
          release-assets/**/*.zip
          release-assets/**/*-boot*.img
